<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaPus Jump & Run</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            background: #000;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100vh;
        }
        
        #gameCanvas {
            display: block;
            border-radius: 10px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        /* Character Selection Screen */
        #characterSelect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 10px;
        }
        
        #characterSelect h1 {
            color: #fff;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }
        
        #characterSelect p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 40px;
        }
        
        .characterOptions {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .characterCard {
            width: 180px;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        
        .characterCard:hover {
            transform: translateY(-10px);
            border-color: #4CAF50;
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.5);
        }
        
        .characterCard.selected {
            border-color: #FFD700;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
        }
        
        .characterIcon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        
        .characterName {
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .characterStats {
            color: #ccc;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .photoOption {
            margin-top: 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .photoOption:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.5);
        }
        
        #startButton {
            margin-top: 20px;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #startButton:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.5);
        }
        
        #startButton:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Camera Modal */
        #cameraModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #cameraModal.active {
            display: flex;
        }
        
        #cameraVideo {
            max-width: 90%;
            max-height: 60vh;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .cameraButtons {
            display: flex;
            gap: 20px;
        }
        
        .cameraButton {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .captureButton {
            background: #4CAF50;
            color: white;
        }
        
        .cancelButton {
            background: #f44336;
            color: white;
        }
        
        .cameraButton:hover {
            transform: scale(1.05);
        }
        
        #photoPreview {
            display: none;
            max-width: 90%;
            max-height: 60vh;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        #cropContainer {
            display: none;
            position: relative;
            margin-bottom: 20px;
        }
        
        #cropContainer.active {
            display: block;
        }
        
        #cropOverlay {
            position: absolute;
            border: 3px solid #4CAF50;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            cursor: move;
        }
        
        .cropHandle {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #4CAF50;
            border: 2px solid white;
            border-radius: 50%;
        }
        
        .cropHandle.nw { top: -7px; left: -7px; cursor: nw-resize; }
        .cropHandle.ne { top: -7px; right: -7px; cursor: ne-resize; }
        .cropHandle.sw { bottom: -7px; left: -7px; cursor: sw-resize; }
        .cropHandle.se { bottom: -7px; right: -7px; cursor: se-resize; }
        
        /* Touch Controls */
        #touchControls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            z-index: 50;
        }
        
        .touchButton {
            position: absolute;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            touch-action: none;
        }
        
        #leftButton, #rightButton {
            width: 80px;
            height: 80px;
            bottom: 20px;
        }
        
        #leftButton {
            left: 20px;
        }
        
        #rightButton {
            left: 120px;
        }
        
        #jumpButton {
            width: 90px;
            height: 90px;
            bottom: 15px;
            right: 120px;
        }
        
        #attackButton {
            width: 90px;
            height: 90px;
            bottom: 15px;
            right: 20px;
        }
        
        .touchButton:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        
        /* Responsive */
        @media (max-width: 800px) {
            #touchControls {
                display: block;
            }
            
            #characterSelect h1 {
                font-size: 32px;
            }
            
            .characterOptions {
                flex-direction: column;
                gap: 15px;
            }
            
            .characterCard {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Character Selection -->
        <div id="characterSelect">
            <h1>🐉 MaPus Jump & Run 🐉</h1>
            <p>Wähle deinen Charakter</p>
            
            <div class="characterOptions">
                <div class="characterCard" data-character="warrior">
                    <div class="characterIcon">🗡️</div>
                    <div class="characterName">Krieger</div>
                    <div class="characterStats">
                        Geschwindigkeit: ⭐⭐⭐<br>
                        Sprung: ⭐⭐<br>
                        Angriff: ⭐⭐⭐⭐
                    </div>
                </div>
                
                <div class="characterCard" data-character="ninja">
                    <div class="characterIcon">🥷</div>
                    <div class="characterName">Ninja</div>
                    <div class="characterStats">
                        Geschwindigkeit: ⭐⭐⭐⭐<br>
                        Sprung: ⭐⭐⭐⭐<br>
                        Angriff: ⭐⭐
                    </div>
                </div>
                
                <div class="characterCard" data-character="mage">
                    <div class="characterIcon">🔮</div>
                    <div class="characterName">Magier</div>
                    <div class="characterStats">
                        Geschwindigkeit: ⭐⭐<br>
                        Sprung: ⭐⭐⭐<br>
                        Angriff: ⭐⭐⭐
                    </div>
                </div>
            </div>
            
            <button class="photoOption" id="photoButton">
                📸 Mit eigenem Gesicht spielen
            </button>
            
            <button id="startButton" disabled>Spiel starten</button>
        </div>
        
        <!-- Camera Modal -->
        <div id="cameraModal">
            <video id="cameraVideo" autoplay playsinline></video>
            <div id="cropContainer">
                <canvas id="photoPreview"></canvas>
                <div id="cropOverlay">
                    <div class="cropHandle nw"></div>
                    <div class="cropHandle ne"></div>
                    <div class="cropHandle sw"></div>
                    <div class="cropHandle se"></div>
                </div>
            </div>
            <div class="cameraButtons">
                <button class="cameraButton captureButton" id="captureButton">📸 Foto aufnehmen</button>
                <button class="cameraButton confirmButton" id="confirmButton" style="display:none; background:#FFD700; color:#000;">✓ Ausschnitt bestätigen</button>
                <button class="cameraButton cancelButton" id="cancelButton">❌ Abbrechen</button>
            </div>
        </div>
        
        <!-- Touch Controls -->
        <div id="touchControls">
            <div class="touchButton" id="leftButton">◀</div>
            <div class="touchButton" id="rightButton">▶</div>
            <div class="touchButton" id="jumpButton">↑</div>
            <div class="touchButton" id="attackButton">X</div>
        </div>
    </div>

    <script>
        // Game Configuration
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Responsive Canvas Setup
        function resizeCanvas() {
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 40;
            const aspectRatio = 800 / 400;
            
            let width = Math.min(800, maxWidth);
            let height = width / aspectRatio;
            
            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }
            
            canvas.width = 800;
            canvas.height = 400;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game State
        let gameState = {
            selectedCharacter: null,
            playerPhoto: null,
            usePhoto: false,
            currentLevel: 1,
            score: 0,
            lives: 3,
            gameStarted: false
        };
        
        // Character Selection
        const characterCards = document.querySelectorAll('.characterCard');
        const startButton = document.getElementById('startButton');
        const photoButton = document.getElementById('photoButton');
        const characterSelect = document.getElementById('characterSelect');
        
        characterCards.forEach(card => {
            card.addEventListener('click', () => {
                characterCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                gameState.selectedCharacter = card.dataset.character;
                startButton.disabled = false;
            });
        });
        
        startButton.addEventListener('click', () => {
            if (gameState.selectedCharacter) {
                characterSelect.style.display = 'none';
                gameState.gameStarted = true;
                startGame();
            }
        });
        
        // Camera Functionality
        const cameraModal = document.getElementById('cameraModal');
        const cameraVideo = document.getElementById('cameraVideo');
        const photoPreview = document.getElementById('photoPreview');
        const cropContainer = document.getElementById('cropContainer');
        const cropOverlay = document.getElementById('cropOverlay');
        const captureButton = document.getElementById('captureButton');
        const confirmButton = document.getElementById('confirmButton');
        const cancelButton = document.getElementById('cancelButton');
        
        let cameraStream = null;
        let cropData = {
            x: 0,
            y: 0,
            width: 200,
            height: 200,
            dragging: false,
            resizing: false,
            handle: null,
            startX: 0,
            startY: 0
        };
        
        photoButton.addEventListener('click', async () => {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                cameraVideo.srcObject = cameraStream;
                cameraModal.classList.add('active');
            } catch (err) {
                alert('Kamera-Zugriff fehlgeschlagen: ' + err.message);
            }
        });
        
        captureButton.addEventListener('click', () => {
            const videoWidth = cameraVideo.videoWidth;
            const videoHeight = cameraVideo.videoHeight;
            
            photoPreview.width = videoWidth;
            photoPreview.height = videoHeight;
            
            const previewCtx = photoPreview.getContext('2d');
            previewCtx.drawImage(cameraVideo, 0, 0);
            
            // Hide video, show crop interface
            cameraVideo.style.display = 'none';
            cropContainer.classList.add('active');
            captureButton.style.display = 'none';
            confirmButton.style.display = 'inline-block';
            
            // Initialize crop area in center
            const size = Math.min(videoWidth, videoHeight) * 0.6;
            cropData.x = (videoWidth - size) / 2;
            cropData.y = (videoHeight - size) / 2;
            cropData.width = size;
            cropData.height = size;
            
            updateCropOverlay();
        });
        
        function updateCropOverlay() {
            const scale = photoPreview.offsetWidth / photoPreview.width;
            cropOverlay.style.left = (cropData.x * scale) + 'px';
            cropOverlay.style.top = (cropData.y * scale) + 'px';
            cropOverlay.style.width = (cropData.width * scale) + 'px';
            cropOverlay.style.height = (cropData.height * scale) + 'px';
        }
        
        // Crop dragging
        cropOverlay.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('cropHandle')) {
                cropData.resizing = true;
                cropData.handle = e.target.className.split(' ')[1];
            } else {
                cropData.dragging = true;
            }
            cropData.startX = e.clientX;
            cropData.startY = e.clientY;
            e.preventDefault();
        });
        
        cropOverlay.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            if (e.target.classList.contains('cropHandle')) {
                cropData.resizing = true;
                cropData.handle = e.target.className.split(' ')[1];
            } else {
                cropData.dragging = true;
            }
            cropData.startX = touch.clientX;
            cropData.startY = touch.clientY;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (cropData.dragging || cropData.resizing) {
                handleCropMove(e.clientX, e.clientY);
            }
        });
        
        document.addEventListener('touchmove', (e) => {
            if (cropData.dragging || cropData.resizing) {
                const touch = e.touches[0];
                handleCropMove(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        });
        
        document.addEventListener('mouseup', () => {
            cropData.dragging = false;
            cropData.resizing = false;
        });
        
        document.addEventListener('touchend', () => {
            cropData.dragging = false;
            cropData.resizing = false;
        });
        
        function handleCropMove(clientX, clientY) {
            const scale = photoPreview.width / photoPreview.offsetWidth;
            const dx = (clientX - cropData.startX) * scale;
            const dy = (clientY - cropData.startY) * scale;
            
            if (cropData.dragging) {
                cropData.x += dx;
                cropData.y += dy;
                
                // Keep in bounds
                cropData.x = Math.max(0, Math.min(cropData.x, photoPreview.width - cropData.width));
                cropData.y = Math.max(0, Math.min(cropData.y, photoPreview.height - cropData.height));
            } else if (cropData.resizing) {
                const minSize = 50;
                
                if (cropData.handle.includes('e')) {
                    cropData.width = Math.max(minSize, cropData.width + dx);
                }
                if (cropData.handle.includes('w')) {
                    const newWidth = cropData.width - dx;
                    if (newWidth >= minSize) {
                        cropData.x += dx;
                        cropData.width = newWidth;
                    }
                }
                if (cropData.handle.includes('s')) {
                    cropData.height = Math.max(minSize, cropData.height + dy);
                }
                if (cropData.handle.includes('n')) {
                    const newHeight = cropData.height - dy;
                    if (newHeight >= minSize) {
                        cropData.y += dy;
                        cropData.height = newHeight;
                    }
                }
                
                // Keep in bounds
                if (cropData.x + cropData.width > photoPreview.width) {
                    cropData.width = photoPreview.width - cropData.x;
                }
                if (cropData.y + cropData.height > photoPreview.height) {
                    cropData.height = photoPreview.height - cropData.y;
                }
            }
            
            cropData.startX = clientX;
            cropData.startY = clientY;
            updateCropOverlay();
        }
        
        confirmButton.addEventListener('click', () => {
            // Extract cropped area
            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 128;  // Größer für bessere Qualität
            faceCanvas.height = 128;
            const faceCtx = faceCanvas.getContext('2d');
            
            faceCtx.drawImage(
                photoPreview, 
                cropData.x, cropData.y, cropData.width, cropData.height,
                0, 0, 128, 128
            );
            
            gameState.playerPhoto = faceCanvas;
            gameState.usePhoto = true;
            
            stopCamera();
            alert('Foto gespeichert! ✅ Starte jetzt das Spiel!');
        });
        
        cancelButton.addEventListener('click', () => {
            stopCamera();
        });
        
        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            cameraModal.classList.remove('active');
            cameraVideo.style.display = 'block';
            cropContainer.classList.remove('active');
            captureButton.style.display = 'inline-block';
            confirmButton.style.display = 'none';
        }
        
        // Game Objects
        class Player {
            constructor(character, photo = null) {
                this.x = 50;
                this.y = 300;
                this.width = 32;
                this.height = 32;
                this.velocityY = 0;
                this.velocityX = 0;
                this.speed = character === 'ninja' ? 5 : character === 'mage' ? 3 : 4;
                this.jumpPower = character === 'ninja' ? -12 : character === 'mage' ? -10 : -11;
                this.gravity = 0.5;
                this.onGround = false;
                this.character = character;
                this.photo = photo;
                this.attacking = false;
                this.attackCooldown = 0;
                this.direction = 1;
            }
            
            update() {
                this.velocityY += this.gravity;
                this.y += this.velocityY;
                this.x += this.velocityX;
                
                // Ground collision
                if (this.y >= 300) {
                    this.y = 300;
                    this.velocityY = 0;
                    this.onGround = true;
                }
                
                // Boundaries
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
                
                // Attack cooldown
                if (this.attackCooldown > 0) this.attackCooldown--;
                if (this.attacking && this.attackCooldown === 0) this.attacking = false;
                
                this.velocityX *= 0.8;
            }
            
            jump() {
                if (this.onGround) {
                    this.velocityY = this.jumpPower;
                    this.onGround = false;
                }
            }
            
            moveLeft() {
                this.velocityX = -this.speed;
                this.direction = -1;
            }
            
            moveRight() {
                this.velocityX = this.speed;
                this.direction = 1;
            }
            
            attack() {
                if (this.attackCooldown === 0) {
                    this.attacking = true;
                    this.attackCooldown = 30;
                }
            }
            
            draw(ctx) {
                // Draw body
                if (this.character === 'warrior') {
                    // Knight armor
                    ctx.fillStyle = '#888';
                    ctx.fillRect(this.x + 8, this.y + 8, 16, 20);
                    ctx.fillStyle = '#666';
                    ctx.fillRect(this.x + 10, this.y + 10, 3, 16);
                    ctx.fillRect(this.x + 19, this.y + 10, 3, 16);
                } else if (this.character === 'ninja') {
                    // Ninja outfit
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(this.x + 8, this.y + 8, 16, 20);
                } else {
                    // Mage robe
                    ctx.fillStyle = '#4a0080';
                    ctx.fillRect(this.x + 8, this.y + 8, 16, 20);
                }
                
                // Draw head (unverhältnismäßig groß wenn Foto)
                if (this.photo) {
                    // Großer Kopf mit Foto (3x größer als normal)
                    const headSize = 36;  // Statt 16
                    const headX = this.x + 16 - headSize / 2;
                    const headY = this.y - 12;  // Höher platziert
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x + 16, headY + headSize / 2, headSize / 2, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(this.photo, headX, headY, headSize, headSize);
                    ctx.restore();
                    
                    // Optionaler Rand um das Foto
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x + 16, headY + headSize / 2, headSize / 2, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    // Default head
                    ctx.fillStyle = '#ffdbac';
                    ctx.fillRect(this.x + 10, this.y, 12, 12);
                    
                    // Eyes
                    ctx.fillStyle = '#000';
                    ctx.fillRect(this.x + 12, this.y + 4, 2, 2);
                    ctx.fillRect(this.x + 18, this.y + 4, 2, 2);
                    
                    // Character-specific head accessories
                    if (this.character === 'mage') {
                        // Wizard hat
                        ctx.fillStyle = '#4a0080';
                        ctx.beginPath();
                        ctx.moveTo(this.x + 16, this.y - 8);
                        ctx.lineTo(this.x + 8, this.y);
                        ctx.lineTo(this.x + 24, this.y);
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                
                // Draw weapon/attack
                if (this.attacking) {
                    if (this.character === 'warrior') {
                        // Sword
                        ctx.fillStyle = '#c0c0c0';
                        const swordX = this.x + (this.direction > 0 ? 24 : 0);
                        ctx.fillRect(swordX, this.y + 10, 16 * this.direction, 4);
                    } else if (this.character === 'ninja') {
                        // Shuriken
                        ctx.fillStyle = '#666';
                        const starX = this.x + 16 + (this.direction * 20);
                        ctx.save();
                        ctx.translate(starX, this.y + 16);
                        ctx.rotate(Date.now() * 0.01);
                        ctx.fillRect(-4, -1, 8, 2);
                        ctx.fillRect(-1, -4, 2, 8);
                        ctx.restore();
                    } else {
                        // Magic beam
                        ctx.fillStyle = '#FFD700';
                        const beamX = this.x + (this.direction > 0 ? 24 : 0);
                        ctx.fillRect(beamX, this.y + 12, 20 * this.direction, 6);
                    }
                }
            }
        }
        
        class Dragon {
            constructor(x, type) {
                this.x = x;
                this.y = 280;
                this.width = 48;
                this.height = 48;
                this.type = type;
                this.health = type * 2;
                this.speed = 1 + type * 0.5;
                this.direction = -1;
            }
            
            update() {
                this.x += this.speed * this.direction;
                
                if (this.x < 0 || this.x > canvas.width - this.width) {
                    this.direction *= -1;
                }
            }
            
            draw(ctx) {
                const colors = ['#ff6b6b', '#ee5a6f', '#c44569', '#8b0000'];
                ctx.fillStyle = colors[this.type - 1] || '#ff6b6b';
                
                // Dragon body
                ctx.fillRect(this.x + 8, this.y + 16, 32, 24);
                
                // Dragon head
                ctx.fillRect(this.x + 32, this.y + 8, 16, 16);
                
                // Eyes
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(this.x + 36, this.y + 12, 4, 4);
                
                // Wings
                ctx.fillStyle = colors[this.type - 1] || '#ff6b6b';
                ctx.globalAlpha = 0.7;
                ctx.fillRect(this.x + 12, this.y + 4, 12, 16);
                ctx.globalAlpha = 1;
                
                // Health bar
                ctx.fillStyle = '#f00';
                ctx.fillRect(this.x, this.y - 8, this.width, 4);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(this.x, this.y - 8, this.width * (this.health / (this.type * 2)), 4);
            }
            
            takeDamage() {
                this.health--;
                return this.health <= 0;
            }
        }
        
        class Pit {
            constructor(x, width) {
                this.x = x;
                this.width = width;
                this.y = 332;
                this.height = canvas.height - 332;
            }
            
            draw(ctx) {
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Lava effect
                ctx.fillStyle = '#ff4500';
                ctx.fillRect(this.x, this.y + this.height - 8, this.width, 8);
            }
            
            checkCollision(player) {
                return player.x + player.width > this.x && 
                       player.x < this.x + this.width && 
                       player.y + player.height >= this.y;
            }
        }
        
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 16;
                this.collected = false;
            }
            
            draw(ctx) {
                if (!this.collected) {
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFA500';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size / 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            checkCollision(player) {
                if (!this.collected) {
                    const dx = player.x + player.width / 2 - this.x;
                    const dy = player.y + player.height / 2 - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < player.width / 2 + this.size / 2) {
                        this.collected = true;
                        return true;
                    }
                }
                return false;
            }
        }
        
        // Game Variables
        let player;
        let dragons = [];
        let pits = [];
        let coins = [];
        let keys = {};
        
        // Touch Controls
        const touchButtons = {
            left: document.getElementById('leftButton'),
            right: document.getElementById('rightButton'),
            jump: document.getElementById('jumpButton'),
            attack: document.getElementById('attackButton')
        };
        
        let touchStates = {
            left: false,
            right: false,
            jump: false,
            attack: false
        };
        
        Object.entries(touchButtons).forEach(([action, button]) => {
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchStates[action] = true;
                if (action === 'jump') player?.jump();
                if (action === 'attack') player?.attack();
            });
            
            button.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchStates[action] = false;
            });
        });
        
        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === 'ArrowUp' || e.key === ' ') {
                player?.jump();
            }
            if (e.key === 'x' || e.key === 'X') {
                player?.attack();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // Level Generation
        function generateLevel(levelNum) {
            dragons = [];
            pits = [];
            coins = [];
            
            const dragonCount = 2 + levelNum;
            const pitCount = Math.min(levelNum, 5);
            const coinCount = 10 + levelNum * 2;
            
            // Generate dragons
            for (let i = 0; i < dragonCount; i++) {
                const x = 200 + i * (canvas.width - 200) / dragonCount;
                const type = Math.min(4, Math.floor(levelNum / 2) + 1);
                dragons.push(new Dragon(x, type));
            }
            
            // Generate pits
            for (let i = 0; i < pitCount; i++) {
                const x = 150 + i * 150;
                const width = 60 + Math.random() * 40;
                pits.push(new Pit(x, width));
            }
            
            // Generate coins
            for (let i = 0; i < coinCount; i++) {
                const x = 100 + Math.random() * (canvas.width - 200);
                const y = 150 + Math.random() * 100;
                coins.push(new Coin(x, y));
            }
        }
        
        // Start Game
        function startGame() {
            const photo = gameState.usePhoto ? gameState.playerPhoto : null;
            player = new Player(gameState.selectedCharacter, photo);
            generateLevel(gameState.currentLevel);
            gameLoop();
        }
        
        // Game Loop
        function gameLoop() {
            if (!gameState.gameStarted) return;
            
            // Clear canvas
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Ground
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 332, canvas.width, canvas.height - 332);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, 332, canvas.width, 8);
            
            // Handle input
            if (keys['ArrowLeft'] || touchStates.left) player.moveLeft();
            if (keys['ArrowRight'] || touchStates.right) player.moveRight();
            
            // Update
            player.update();
            dragons.forEach(dragon => dragon.update());
            
            // Check pit collisions
            pits.forEach(pit => {
                if (pit.checkCollision(player)) {
                    gameState.lives--;
                    player.x = 50;
                    player.y = 300;
                    player.velocityY = 0;
                    
                    if (gameState.lives <= 0) {
                        alert('Game Over! Score: ' + gameState.score);
                        location.reload();
                    }
                }
            });
            
            // Check coin collisions
            coins.forEach(coin => {
                if (coin.checkCollision(player)) {
                    gameState.score += 10;
                }
            });
            
            // Check attack collisions
            if (player.attacking) {
                dragons = dragons.filter(dragon => {
                    const hit = Math.abs(dragon.x - player.x) < 50 && 
                                Math.abs(dragon.y - player.y) < 50;
                    if (hit && dragon.takeDamage()) {
                        gameState.score += 50;
                        return false;
                    }
                    return true;
                });
            }
            
            // Check if level complete
            if (dragons.length === 0) {
                gameState.currentLevel++;
                generateLevel(gameState.currentLevel);
            }
            
            // Draw
            pits.forEach(pit => pit.draw(ctx));
            coins.forEach(coin => coin.draw(ctx));
            dragons.forEach(dragon => dragon.draw(ctx));
            player.draw(ctx);
            
            // Draw HUD
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('Score: ' + gameState.score, 10, 30);
            ctx.fillText('Level: ' + gameState.currentLevel, 10, 60);
            ctx.fillText('Lives: ' + '❤️'.repeat(gameState.lives), 10, 90);
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
